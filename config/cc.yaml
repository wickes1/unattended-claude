# unattended-claude — config template
# Copied to ~/.config/unattended-claude/cc.yaml by `ucl init`

paths:
  runtime_dir: ~/unattended

runtime:
  driver: claude
  bin: happy                                      # claude TUI wrapper
  extra_args:
    - --dangerously-skip-permissions

execution:
  max_parallel_tabs: 3
  context_compact_threshold: 150000               # tokens
  wind_down_lead_minutes: 5
  episode_hard_timeout: 60m
  inactivity_timeout: 30s
  capture_lines: 3000
  cooldown: 0s
  max_consecutive_errors: 5

detection:
  dialog_poll_interval: 500ms
  dialog_timeout: 30s

rate_limit:
  safety_margin: 30s
  parse_fail_fallback: 1h

archive:
  auto_after_days: 7

schedule:
  windows: []                                     # default empty; add via `ucl schedule add`

terminal:
  term: xterm-256color
  env_scrub: [CLAUDECODE]
  env_set:
    CLAUDE_CODE_NO_FLICKER: "1"

logging:
  level: info                                     # debug | info | warn | error
  dir: ~/unattended/logs
