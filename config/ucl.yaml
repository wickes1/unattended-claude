# unattended-claude — config template
# Copied to ~/.config/unattended-claude/ucl.yaml by `ucl init`

paths:
  runtime_dir: ~/unattended

runtime:
  bin: claude                                     # `claude` (default — Anthropic's Claude Code CLI)
                                                  # or `happy` for mobile / web monitoring via Happy Coder
                                                  # (https://happy.engineering); requires Happy installed
                                                  # and configured first.
  extra_args:
    - --dangerously-skip-permissions

execution:
  max_parallel_tabs: 3
  wind_down_lead_minutes: 5
  episode_hard_timeout: 60m
  inactivity_timeout: 30s
  capture_lines: 3000

detection:
  dialog_poll_interval: 500ms
  dialog_timeout: 30s

rate_limit:
  safety_margin: 30s
  parse_fail_fallback: 1h

archive:
  auto_after_days: 7

subscription:
  # Best-effort weekly token cap for your Claude subscription. Used by
  # `ucl stats` to render a utilization percentage. Anthropic does not
  # publish a stable per-plan number, so tune this for your plan + use
  # pattern. Leave as 0 to suppress the utilization line.
  weekly_token_cap: 1000000

schedule:
  windows: []                                     # default empty; add via `ucl schedule add`

terminal:
  term: xterm-256color
  env_scrub: [CLAUDECODE]
  env_set:
    CLAUDE_CODE_NO_FLICKER: "1"

logging:
  level: info                                     # debug | info | warn | error
  dir: ~/unattended/logs
